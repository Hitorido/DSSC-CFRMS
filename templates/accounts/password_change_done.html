{% extends "base.html" %}

{% block title %}Password Updated{% endblock %}

{% block content %}
<div class="cfrms-page-header">
  <h1><i class="bi bi-shield-check me-2"></i>Password Updated</h1>
</div>
<section class="cfrms-card password-success-card">
  <span class="password-success-icon"><i class="bi bi-check2"></i></span>
  <h2>Your password has been changed.</h2>
  <p class="text-muted">Your account is ready to use with the new password.</p>
  <a href="{% url 'accounts:settings' %}" class="btn btn-cfrms-primary">Return to Settings</a>
</section>
{% endblock %}
